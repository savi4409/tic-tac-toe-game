
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe | Play with Computer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Tic Tac Toe</h1>
        <p class="subtitle">Challenge the Computer!</p>

        <div class="players">
            <div class="player active">
                <span class="symbol">X</span>
                <span>You</span>
            </div>

            <div class="vs">VS</div>

            <div class="player">
                <span class="symbol">O</span>
                <span>Computer</span>
            </div>
        </div>

        <h2 id="status">Your Turn (X)</h2>

        <div class="board">
            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>
        </div>

        <button id="restart">↻ Restart Game</button>

        <p class="footer">Made with ♥ using HTML, CSS & JavaScript</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
